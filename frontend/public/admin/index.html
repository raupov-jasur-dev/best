<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Admin — Bukhara Best</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --sidebar-w: 240px;
      --navy: #0f1f33;
      --red: #c8102e;
      --bg: #f4f6f9;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--navy);
      color: #e2e8f0;
      position: fixed;
      left: 0; top: 0; bottom: 0;
      z-index: 1040;
      display: flex;
      flex-direction: column;
      transition: transform .25s ease;
    }
    .sidebar a {
      color: #94a3b8;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: .7rem 1.15rem;
      font-size: 14px;
      border-left: 3px solid transparent;
    }
    .sidebar a:hover, .sidebar a.active {
      background: rgba(255,255,255,.06);
      color: #fff;
      border-left-color: var(--red);
    }
    .sidebar-brand {
      padding: 1.1rem 1.15rem;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .sidebar-brand strong { color: #fff; font-size: 1rem; }
    .main {
      margin-left: var(--sidebar-w);
      padding: 1.25rem;
      min-height: 100vh;
    }
    .topbar-mobile {
      display: none;
      position: sticky;
      top: 0;
      z-index: 1030;
      background: var(--navy);
      color: #fff;
      padding: .65rem 1rem;
      align-items: center;
      justify-content: space-between;
    }
    .stat-card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
      height: 100%;
    }
    .stat-card .label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: .04em; }
    .stat-card .value { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0f1f33, #1a3352);
      padding: 1rem;
    }
    .login-card { width: 100%; max-width: 400px; border-radius: 16px; border: none; }
    .table-wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.04); overflow: auto; }
    .table img { max-height: 40px; border-radius: 4px; }
    .badge-soft { font-weight: 500; }
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 1035;
    }
    .sidebar-backdrop.show { display: block; }
    #app { display: none; }
    #loginPage { display: none; }
    .form-card {
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .btn-red { background: var(--red); border-color: var(--red); color: #fff; }
    .btn-red:hover { background: #a50d25; border-color: #a50d25; color: #fff; }
    .cat-card {
      background: #fff;
      border-radius: 10px;
      padding: 1rem;
      border: 1px solid #e5e7eb;
      height: 100%;
    }

    @media (max-width: 991.98px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; padding: 1rem; }
      .topbar-mobile { display: flex; }
      .stat-card .value { font-size: 1.35rem; }
      .table { font-size: 13px; }
      .hide-mobile { display: none !important; }
    }
    @media (max-width: 575.98px) {
      .main { padding: .75rem; }
      .btn-group-mobile { display: flex; flex-direction: column; gap: .5rem; }
      .btn-group-mobile .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="loginPage" class="login-wrap">
    <div class="card login-card shadow">
      <div class="card-body p-4">
        <div class="text-center mb-3">
          <div class="rounded-2 d-inline-flex align-items-center justify-content-center mb-2"
               style="width:44px;height:44px;background:#c8102e;color:#fff;font-weight:800">BB</div>
          <h5 class="mb-0">Bukhara Best Admin</h5>
          <small class="text-muted">Boshqaruv paneli</small>
        </div>
        <div id="loginError" class="alert alert-danger d-none py-2"></div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control form-control-lg" id="username" required autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg" id="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-red w-100 btn-lg" type="submit">Kirish</button>
        </form>
      </div>
    </div>
  </div>

  <div id="app">
    <div class="topbar-mobile">
      <button class="btn btn-sm btn-outline-light" id="openSidebar" type="button">
        <i class="bi bi-list fs-5"></i>
      </button>
      <strong>Bukhara Best</strong>
      <button class="btn btn-sm btn-outline-light" id="logoutBtnMobile" type="button">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <strong>Bukhara Best</strong>
        <div class="small text-secondary">Admin Panel</div>
      </div>
      <nav class="mt-2 flex-grow-1">
        <a href="#dashboard" data-page="dashboard" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="#news" data-page="news"><i class="bi bi-newspaper"></i> Yangiliklar</a>
        <a href="#news-create" data-page="news-create"><i class="bi bi-plus-circle"></i> Yangi qo‘shish</a>
        <a href="#categories" data-page="categories"><i class="bi bi-tags"></i> Kategoriyalar</a>
        <a href="#comments" data-page="comments"><i class="bi bi-chat-dots"></i> Izohlar</a>
      </nav>
      <a href="#" id="logoutBtn" class="mb-2"><i class="bi bi-box-arrow-right"></i> Chiqish</a>
    </aside>

    <div class="main">
      <div id="content"></div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = (window.__API_URL__ || localStorage.getItem('API_URL') || (location.hostname === 'localhost' ? 'http://localhost:3000' : '')).replace(/\/$/, '') + '/api';
    let token = localStorage.getItem('admin_token') || '';

    function headers(json = true) {
      const h = { Authorization: 'Bearer ' + token };
      if (json) h['Content-Type'] = 'application/json';
      return h;
    }

    async function api(path, opts = {}) {
      const isFD = opts.body instanceof FormData;
      const res = await fetch(API + path, {
        ...opts,
        headers: { ...headers(!isFD), ...(opts.headers || {}) }
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
      if (!res.ok) throw new Error(data.message || data.errors?.[0] || 'Xato');
      return data;
    }

    function logout() {
      token = '';
      localStorage.removeItem('admin_token');
      showLogin();
    }

    function showLogin() {
      document.getElementById('app').style.display = 'none';
      document.getElementById('loginPage').style.display = 'flex';
    }
    function showApp() {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      route();
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarBackdrop').classList.remove('show');
    }
    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebarBackdrop').classList.add('show');
    }

    document.getElementById('openSidebar')?.addEventListener('click', openSidebar);
    document.getElementById('sidebarBackdrop')?.addEventListener('click', closeSidebar);
    document.getElementById('logoutBtn')?.addEventListener('click', (e) => { e.preventDefault(); logout(); });
    document.getElementById('logoutBtnMobile')?.addEventListener('click', (e) => { e.preventDefault(); logout(); });

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('loginError');
      err.classList.add('d-none');
      try {
        const data = await fetch(API + '/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        }).then(r => r.json());
        if (!data.success) throw new Error(data.message || 'Login xato');
        token = data.token;
        localStorage.setItem('admin_token', token);
        showApp();
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('d-none');
      }
    };

    document.querySelectorAll('[data-page]').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('[data-page]').forEach(x => x.classList.remove('active'));
        a.classList.add('active');
        location.hash = a.dataset.page;
        closeSidebar();
        route();
      });
    });

    async function route() {
      const page = (location.hash || '#dashboard').slice(1);
      const el = document.getElementById('content');
      el.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-secondary"></div></div>';
      try {
        if (page === 'dashboard') await renderDashboard(el);
        else if (page === 'news') await renderNews(el);
        else if (page === 'news-create') await renderNewsForm(el);
        else if (page.startsWith('news-edit-')) await renderNewsForm(el, page.replace('news-edit-', ''));
        else if (page === 'categories') await renderCategories(el);
        else if (page === 'comments') await renderComments(el);
        else el.innerHTML = '<p>Topilmadi</p>';
      } catch (e) {
        el.innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
      }
    }

    async function renderDashboard(el) {
      const { data } = await api('/admin/dashboard');
      el.innerHTML = `
        <h4 class="mb-3">Dashboard</h4>
        <div class="row g-3 mb-4">
          ${[
            ['Jami yangiliklar', data.totalNews, ''],
            ['Published', data.publishedNews, 'text-success'],
            ['Draft', data.draftNews, 'text-warning'],
            ['Ko‘rishlar', data.totalViews, ''],
            ['Kategoriyalar', data.totalCategories, ''],
            ['Izohlar', data.totalComments, ''],
            ['Telegram OK', data.telegramPublished, 'text-success'],
            ['Telegram xato', data.telegramFailed, 'text-danger']
          ].map(([l,v,c]) => `
            <div class="col-6 col-md-3">
              <div class="card stat-card p-3">
                <div class="label">${l}</div>
                <div class="value ${c}">${v ?? 0}</div>
              </div>
            </div>`).join('')}
        </div>
        <div class="table-wrap p-3">
          <h6 class="mb-3">Eng ko‘p ko‘rilgan</h6>
          <div class="table-responsive">
            <table class="table table-sm mb-0">
              <thead><tr><th>Title</th><th>Views</th><th class="hide-mobile">Category</th></tr></thead>
              <tbody>
                ${(data.topViewed || []).map(n => `
                  <tr>
                    <td>${esc(n.title)}</td>
                    <td>${n.views}</td>
                    <td class="hide-mobile">${esc(n.category?.name || '')}</td>
                  </tr>`).join('') || '<tr><td colspan="3" class="text-muted">Ma’lumot yo‘q</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function renderNews(el) {
      const { data } = await api('/admin/news?limit=50');
      el.innerHTML = `
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h4 class="mb-0">Yangiliklar</h4>
          <button class="btn btn-red btn-sm" onclick="location.hash='news-create';route()">
            <i class="bi bi-plus-lg"></i> Qo‘shish
          </button>
        </div>
        <div class="table-wrap">
          <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Status</th>
                  <th class="hide-mobile">TG</th>
                  <th class="hide-mobile">Views</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${(data || []).map(n => `
                  <tr>
                    <td>${n.id}</td>
                    <td>
                      <div class="d-flex align-items-center gap-2">
                        ${n.mainImage ? `<img src="${n.mainImage}" alt="">` : ''}
                        <span>${esc((n.title || '').slice(0, 50))}</span>
                      </div>
                    </td>
                    <td><span class="badge ${n.status === 'published' ? 'bg-success' : 'bg-secondary'}">${n.status}</span></td>
                    <td class="hide-mobile">
                      <span class="badge ${n.telegramStatus === 'published' ? 'bg-success' : n.telegramStatus === 'failed' ? 'bg-danger' : 'bg-secondary'}">${n.telegramStatus || '-'}</span>
                      ${n.telegramStatus === 'failed' ? `<button class="btn btn-sm btn-outline-danger ms-1" onclick="retryTg(${n.id})">Retry</button>` : ''}
                    </td>
                    <td class="hide-mobile">${n.views || 0}</td>
                    <td class="text-nowrap">
                      <button class="btn btn-sm btn-outline-primary" onclick="location.hash='news-edit-${n.id}';route()">Edit</button>
                      <button class="btn btn-sm btn-outline-danger" onclick="delNews(${n.id})">Del</button>
                    </td>
                  </tr>`).join('') || '<tr><td colspan="6" class="text-muted p-3">Yangilik yo‘q</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    window.retryTg = async (id) => {
      try {
        await api('/admin/news/' + id + '/telegram-retry', { method: 'POST' });
        alert('Telegram qayta yuborildi');
        route();
      } catch (e) { alert(e.message); }
    };
    window.delNews = async (id) => {
      if (!confirm('O‘chirishni tasdiqlaysizmi?')) return;
      await api('/admin/news/' + id, { method: 'DELETE' });
      route();
    };

    async function renderNewsForm(el, id = null) {
      let news = null;
      if (id) {
        const r = await api('/admin/news/' + id);
        news = r.data;
      }
      const cats = (await api('/admin/categories')).data || [];
      if (!cats.length) {
        el.innerHTML = `<div class="alert alert-warning">
          Avval <a href="#categories" onclick="location.hash='categories';route()">kategoriya</a> yarating.
        </div>`;
        return;
      }

      el.innerHTML = `
        <h4 class="mb-3">${id ? 'Tahrirlash' : 'Yangi yangilik'}</h4>
        <form id="newsForm" class="form-card">
          <div class="mb-3">
            <label class="form-label fw-semibold">Sarlavha *</label>
            <input class="form-control" name="title" required value="${esc(news?.title || '')}">
          </div>
          <div class="mb-3">
            <label class="form-label">Qisqa tavsif</label>
            <textarea class="form-control" name="shortDescription" rows="2">${esc(news?.shortDescription || '')}</textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">To‘liq matn</label>
            <textarea class="form-control" name="content" rows="8">${esc(news?.content || '')}</textarea>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Kategoriya *</label>
              <select class="form-select" name="categoryId" required>
                ${cats.map(c => `<option value="${c.id}" ${news?.categoryId == c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Status</label>
              <select class="form-select" name="status">
                <option value="draft" ${news?.status === 'draft' ? 'selected' : ''}>Draft</option>
                <option value="published" ${news?.status === 'published' ? 'selected' : ''}>Published</option>
              </select>
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <div class="form-check mb-2">
                <input type="checkbox" class="form-check-input" name="featured" id="featured" ${news?.featured ? 'checked' : ''}>
                <label class="form-check-label" for="featured">Featured</label>
              </div>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Asosiy rasm</label>
            <input type="file" class="form-control" name="mainImage" accept="image/*">
            ${news?.mainImage ? `<img src="${news.mainImage}" class="mt-2 rounded" style="max-height:80px">` : ''}
          </div>
          <div class="mb-3">
            <label class="form-label">Qo‘shimcha rasmlar</label>
            <input type="file" class="form-control" name="additionalImages" accept="image/*" multiple>
          </div>
          <div class="mb-3">
            <label class="form-label">Video</label>
            <input type="file" class="form-control" name="video" accept="video/*">
            ${news?.video ? `<video src="${news.video}" class="mt-2 rounded" style="max-height:100px" controls></video>` : ''}
          </div>
          ${news?.telegramError ? `<div class="alert alert-warning">Telegram: ${esc(news.telegramError)}</div>` : ''}
          <div class="d-flex flex-column flex-sm-row gap-2">
            <button type="submit" class="btn btn-secondary" data-action="save">Saqlash (Draft)</button>
            <button type="submit" class="btn btn-red" data-action="publish">Saqlash va e’lon qilish</button>
          </div>
        </form>`;

      document.getElementById('newsForm').onsubmit = async (e) => {
        e.preventDefault();
        const action = e.submitter?.dataset?.action || 'save';
        const fd = new FormData(e.target);
        fd.set('featured', e.target.featured.checked ? 'true' : 'false');
        if (action === 'publish') fd.set('publishAndTelegram', 'true');
        else fd.set('status', 'draft');
        try {
          const url = id ? '/admin/news/' + id : '/admin/news';
          const method = id ? 'PUT' : 'POST';
          await api(url, { method, body: fd });
          alert(action === 'publish' ? 'E’lon qilindi' : 'Draft saqlandi');
          location.hash = 'news';
          route();
        } catch (ex) { alert(ex.message); }
      };
    }

    async function renderCategories(el) {
      const { data } = await api('/admin/categories');
      el.innerHTML = `
        <h4 class="mb-3">Kategoriyalar</h4>
        <form id="catForm" class="form-card mb-4">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-md-4">
              <label class="form-label">Nomi *</label>
              <input class="form-control" name="name" placeholder="Masalan: Sport" required>
            </div>
            <div class="col-12 col-md-5">
              <label class="form-label">Tavsif</label>
              <input class="form-control" name="description" placeholder="Qisqa tavsif">
            </div>
            <div class="col-12 col-md-3">
              <button class="btn btn-red w-100" type="submit"><i class="bi bi-plus-lg"></i> Qo‘shish</button>
            </div>
          </div>
        </form>
        <div class="row g-3" id="catList">
          ${(data || []).map(c => `
            <div class="col-12 col-sm-6 col-lg-4">
              <div class="cat-card">
                <div class="d-flex justify-content-between align-items-start gap-2">
                  <div>
                    <div class="fw-semibold">${esc(c.name)}</div>
                    <div class="small text-muted">${esc(c.slug || '')}</div>
                    ${c.description ? `<div class="small mt-1">${esc(c.description)}</div>` : ''}
                    <div class="small text-secondary mt-1">${c.postsCount || 0} ta yangilik</div>
                  </div>
                  <div class="d-flex flex-column gap-1">
                    <button class="btn btn-sm btn-outline-primary" onclick="editCat(${c.id}, '${esc(c.name).replace(/'/g, "\\'")}', '${esc(c.description || '').replace(/'/g, "\\'")}')">Edit</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="delCat(${c.id})">O‘chirish</button>
                  </div>
                </div>
              </div>
            </div>`).join('') || '<div class="col-12 text-muted">Kategoriya yo‘q — yuqoridan qo‘shing</div>'}
        </div>`;

      document.getElementById('catForm').onsubmit = async (e) => {
        e.preventDefault();
        const name = e.target.name.value.trim();
        const description = e.target.description.value.trim();
        try {
          await api('/admin/categories', {
            method: 'POST',
            body: JSON.stringify({ name, description })
          });
          route();
        } catch (ex) { alert(ex.message); }
      };
    }

    window.editCat = async (id, name, description) => {
      const newName = prompt('Kategoriya nomi:', name);
      if (newName === null || !newName.trim()) return;
      const newDesc = prompt('Tavsif:', description || '');
      if (newDesc === null) return;
      try {
        await api('/admin/categories/' + id, {
          method: 'PUT',
          body: JSON.stringify({ name: newName.trim(), description: newDesc.trim() })
        });
        route();
      } catch (e) { alert(e.message); }
    };

    window.delCat = async (id) => {
      if (!confirm('Kategoriyani o‘chirishni tasdiqlaysizmi?')) return;
      try {
        await api('/admin/categories/' + id, { method: 'DELETE' });
        route();
      } catch (e) { alert(e.message); }
    };

    async function renderComments(el) {
      const { data } = await api('/admin/comments');
      el.innerHTML = `
        <h4 class="mb-3">Izohlar</h4>
        <div class="table-wrap">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr><th>Author</th><th>Izoh</th><th class="hide-mobile">News</th><th></th></tr>
              </thead>
              <tbody>
                ${(data || []).map(c => `
                  <tr>
                    <td>${esc(c.authorName)}</td>
                    <td>${esc((c.content || '').slice(0, 80))}</td>
                    <td class="hide-mobile">${esc((c.news?.title || '').slice(0, 40))}</td>
                    <td><button class="btn btn-sm btn-outline-danger" onclick="delComment(${c.id})">Del</button></td>
                  </tr>`).join('') || '<tr><td colspan="4" class="text-muted p-3">Izoh yo‘q</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>`;
    }
    window.delComment = async (id) => {
      if (!confirm('O‘chirish?')) return;
      await api('/admin/comments/' + id, { method: 'DELETE' });
      route();
    };

    if (token) {
      api('/admin/me').then(showApp).catch(showLogin);
    } else showLogin();
    window.addEventListener('hashchange', route);
  </script>
</body>
</html>
