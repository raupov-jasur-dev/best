<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kategoriya — Bukhara Best</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/portal.css" rel="stylesheet">
</head>
<body>
  <div id="header"></div>
  <main>
    <div id="loading" class="loading-wrap"><div class="spinner"></div></div>
    <div id="app" style="display:none"></div>
  </main>
  <div id="footer"></div>

  <script src="/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const page = new URLSearchParams(location.search).get('page') || 1;

    async function init() {
      if (!id) { location.href = '/'; return; }
      try {
        const [catRes, newsRes, allCats] = await Promise.all([
          BB.api('/categories/' + id),
          BB.api('/news?category=' + id + '&limit=12&page=' + page),
          BB.api('/categories')
        ]);
        const cat = catRes.data;
        const news = newsRes.data || [];
        const pag = newsRes.pagination || {};
        const cats = allCats.data || [];

        document.title = (cat?.name || 'Kategoriya') + ' — Bukhara Best';
        document.getElementById('header').innerHTML = BB.renderHeader(cats, 'cat-' + id);
        document.getElementById('footer').innerHTML = BB.renderFooter(cats);
        BB.bindHeader();

        let pagHtml = '';
        if (pag.pages > 1) {
          pagHtml = '<nav class="pagination">';
          if (pag.page > 1) pagHtml += `<a href="?id=${id}&page=${pag.page - 1}">←</a>`;
          pagHtml += `<span class="current">${pag.page}</span>`;
          if (pag.page < pag.pages) pagHtml += `<a href="?id=${id}&page=${pag.page + 1}">→</a>`;
          pagHtml += '</nav>';
        }

        document.getElementById('app').innerHTML = `
          <div class="page-head">
            <div class="container">
              <h1>${BB.escape(cat?.name || 'Kategoriya')}</h1>
              <p>${pag.total != null ? pag.total + ' ta material' : ''}</p>
            </div>
          </div>
          <section class="section">
            <div class="container">
              <div class="news-grid">
                ${news.map(n => BB.cardHtml(n, { showExcerpt: true })).join('') ||
                  '<div class="empty-state">Bu kategoriyada yangilik yo‘q</div>'}
              </div>
              ${pagHtml}
            </div>
          </section>`;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';
      } catch (e) {
        document.getElementById('loading').innerHTML =
          `<div class="alert alert-error container">${BB.escape(e.message)}</div>`;
      }
    }
    init();
  </script>
</body>
</html>
