<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kategoriya — Bukhara Best</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">Bukhara Best</a>
    </div>
  </nav>
  <main class="container py-4">
    <h2 id="title" class="mb-4">Kategoriya</h2>
    <div id="grid" class="row g-3"></div>
  </main>
  <script src="config.js"></script>
  <script>
    const API = (window.__API_URL__ || '').replace(/\/$/, '') + '/api';
    const id = new URLSearchParams(location.search).get('id');
    Promise.all([
      fetch(API + '/categories/' + id).then(r => r.json()),
      fetch(API + '/news?category=' + id + '&limit=24').then(r => r.json())
    ]).then(([cat, news]) => {
      document.getElementById('title').textContent = cat.data?.name || 'Kategoriya';
      document.getElementById('grid').innerHTML = (news.data || []).map(n => `
        <div class="col-md-4"><div class="card h-100">
          ${n.mainImage ? `<img src="${n.mainImage}" class="card-img-top" style="height:160px;object-fit:cover">` : ''}
          <div class="card-body">
            <h5><a href="/post.html?id=${n.id}" class="text-dark text-decoration-none">${n.title}</a></h5>
          </div>
        </div></div>`).join('') || '<p>Yangilik yo‘q</p>';
    });
  </script>
</body>
</html>
