<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qidiruv — Bukhara Best</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/portal.css" rel="stylesheet">
</head>
<body>
  <div id="header"></div>
  <div class="search-hero">
    <div class="container">
      <h1>Qidiruv</h1>
      <form class="search-bar" id="searchForm">
        <input type="search" name="q" id="qInput" placeholder="Kalit so‘z kiriting..." autocomplete="off">
        <button type="submit">Qidirish</button>
      </form>
    </div>
  </div>
  <main>
    <div class="container section" id="results">
      <p class="meta">Qidiruv uchun so‘z yozing</p>
    </div>
  </main>
  <div id="footer"></div>

  <script src="/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    const q = new URLSearchParams(location.search).get('q') || '';
    document.getElementById('qInput').value = q;

    document.getElementById('searchForm').onsubmit = (e) => {
      e.preventDefault();
      const val = document.getElementById('qInput').value.trim();
      location.href = '/search.html?q=' + encodeURIComponent(val);
    };

    async function init() {
      try {
        const catRes = await BB.api('/categories');
        const cats = catRes.data || [];
        document.getElementById('header').innerHTML = BB.renderHeader(cats, '');
        document.getElementById('footer').innerHTML = BB.renderFooter(cats);
        BB.bindHeader();

        if (!q) return;
        const res = await BB.api('/news?search=' + encodeURIComponent(q) + '&limit=30');
        const list = res.data || [];
        const el = document.getElementById('results');
        if (!list.length) {
          el.innerHTML = `<p class="empty-state">«${BB.escape(q)}» bo‘yicha natija topilmadi</p>`;
          return;
        }
        el.innerHTML = `
          <p class="meta" style="margin-bottom:12px">${list.length} ta natija</p>
          ${list.map(n => `
            <a class="search-result" href="/post.html?id=${n.id}">
              ${n.mainImage
                ? `<img src="${BB.escape(n.mainImage)}" alt="" loading="lazy">`
                : `<div style="width:140px;height:100px;background:#eef1f4;border-radius:6px"></div>`}
              <div>
                ${n.category ? `<span class="badge-cat">${BB.escape(n.category.name)}</span>` : ''}
                <h3>${BB.escape(n.title)}</h3>
                <p class="meta" style="margin:0 0 4px;color:var(--text-secondary);font-size:13.5px">
                  ${BB.escape(BB.excerpt(n.shortDescription || n.content, 140))}
                </p>
                <div class="meta">
                  <span>${BB.formatDate(n.publishedAt)}</span>
                  <span class="dot"><i class="bi bi-eye"></i> ${n.views || 0}</span>
                </div>
              </div>
            </a>`).join('')}`;
      } catch (e) {
        document.getElementById('results').innerHTML =
          `<div class="alert alert-error">${BB.escape(e.message)}</div>`;
      }
    }
    init();
  </script>
</body>
</html>
